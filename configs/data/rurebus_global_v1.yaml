dataset:
  name: rurebus
  version: corrected_v1
  protocol_version: global_v1
  format: brat
  role: locked_application_evaluation
  processed_dir: rurebus_data/versions/corrected_v1
  manifest_path: rurebus_data/versions/corrected_v1/global_v1_manifest.csv
  protocol_report_path: rurebus_data/versions/corrected_v1/global_v1_report.json
  dataset_report_path: rurebus_data/versions/corrected_v1/dataset_report.json
  corrections_path: configs/data/corrections/rurebus_corrected_v1.csv

splits:
  train: train
  validation: validation
  test: global_test
  legacy_test: legacy_test
  group_key: source_id
  group_disjoint: true
  text_sha256_disjoint: true

entities:
  labels: [MET, ECO, BIN, CMP, QUA, ACT, INST, SOC]

relations:
  labels: [GOL, TSK, PNG, PNT, PPS, NNG, NNT, NPS, FNG, FNT, FPS]
  negative_label: NO_RELATION
  multilabel: true

evaluation_policy:
  model_selection_split: validation
  final_split: global_test
  legacy_split: legacy_test
  global_test_parent_split: train_only
  global_test_single_use: true
  warning: >-
    Do not inspect global_test predictions or metrics until NER and relation
    checkpoints, decoding thresholds and all hyperparameters are frozen.

preprocessing:
  preserve_raw_text: true
  tagging_scheme: BIO
