[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rurebus-ie"
version = "0.1.0"
description = "Information extraction tools for the Russian RuREBus corpus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.2",
    "transformers>=4.45,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rurebus-preprocess = "rurebus_ie.data.preprocessing:main"
rurebus-train-ner = "rurebus_ie.training.ner_experiment:train_main"
rurebus-test-ner = "rurebus_ie.training.ner_experiment:test_main"
rurebus-analyze-ner = "rurebus_ie.training.ner_experiment:analyze_main"
rurebus-train-span-ner = "rurebus_ie.training.span_experiment:train_main"
rurebus-test-span-ner = "rurebus_ie.training.span_experiment:test_main"
rurebus-train-hierarchical-span-ner = "rurebus_ie.training.hierarchical_span_experiment:train_main"
rurebus-test-hierarchical-span-ner = "rurebus_ie.training.hierarchical_span_experiment:test_main"
rurebus-build-version = "rurebus_ie.data.dataset_versioning:main"
rurebus-build-protocol = "rurebus_ie.data.protocol_split:main"
rurebus-train-relations = "rurebus_ie.training.relation_experiment:train_main"
rurebus-test-relations = "rurebus_ie.training.relation_experiment:test_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
